[project]
name = "voice-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "poorthi12", email = "poorna8217@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai-whisper>=20250625",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyttsx3>=2.99",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
voice-ai-assistant = "voice_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
